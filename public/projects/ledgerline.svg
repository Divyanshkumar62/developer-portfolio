<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>
  
  <!-- Subtle Grid -->
  <g opacity="0.06" stroke="#fff" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Title Badge -->
  <rect x="40" y="35" width="160" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="54" cy="49" r="5" fill="#10b981"/>
  <text x="68" y="53" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">CORE LEDGER V0.1</text>

  <text x="40" y="95" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700">LedgerLine Architecture</text>
  <text x="40" y="118" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">High-Concurrency Double-Entry Engine &amp; Transactional Outbox</text>

  <!-- Flow Nodes Container -->
  <!-- 1. API Ingestion Node -->
  <g transform="translate(40, 160)" filter="url(#shadow)">
    <rect width="200" height="220" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="16" y="16" width="36" height="36" rx="8" fill="#1e293b"/>
    <path d="M26 34 L34 34 M34 30 L38 34 L34 38" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="62" y="32" fill="#f1f5f9" font-family="sans-serif" font-size="15" font-weight="600">Client Gateway</text>
    <text x="62" y="47" fill="#64748b" font-family="sans-serif" font-size="11">Idempotency Guard</text>

    <line x1="16" y1="68" x2="184" y2="68" stroke="#1e293b" stroke-width="1"/>

    <text x="16" y="95" fill="#94a3b8" font-family="monospace" font-size="11">• Idempotency-Key</text>
    <text x="16" y="120" fill="#94a3b8" font-family="monospace" font-size="11">• 500 Replays → 1 Tx</text>
    <text x="16" y="145" fill="#94a3b8" font-family="monospace" font-size="11">• Ordered Lock Order</text>
    <text x="16" y="170" fill="#94a3b8" font-family="monospace" font-size="11">• 0% Deadlock Rate</text>

    <rect x="16" y="190" width="168" height="20" rx="4" fill="#1e293b"/>
    <text x="24" y="204" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="600">SPRING BOOT 4 + JAVA 21</text>
  </g>

  <!-- Connection Line 1 -> 2 -->
  <path d="M240 270 L280 270" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4"/>
  <circle cx="280" cy="270" r="3" fill="#38bdf8"/>

  <!-- 2. Postgres Source of Truth Node -->
  <g transform="translate(290, 150)" filter="url(#shadow)">
    <rect width="230" height="240" rx="12" fill="#0f172a" stroke="#0284c7" stroke-width="2"/>
    <rect x="16" y="16" width="36" height="36" rx="8" fill="#0c4a6e"/>
    <path d="M26 30 C26 26 42 26 42 30 C42 34 26 34 26 30 Z M26 34 C26 38 42 38 42 34 M26 38 C26 42 42 42 42 38" stroke="#38bdf8" stroke-width="1.8" fill="none"/>
    <text x="62" y="32" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="700">PostgreSQL 16</text>
    <text x="62" y="48" fill="#38bdf8" font-family="sans-serif" font-size="11">Single Source of Truth</text>

    <line x1="16" y1="68" x2="214" y2="68" stroke="#1e293b" stroke-width="1"/>

    <rect x="16" y="80" width="198" height="28" rx="6" fill="#132337"/>
    <text x="26" y="98" fill="#10b981" font-family="monospace" font-size="11" font-weight="600">Σ(Debits) == Σ(Credits)</text>

    <text x="16" y="130" fill="#94a3b8" font-family="sans-serif" font-size="12">• Deferred Constraint Trigger</text>
    <text x="16" y="152" fill="#94a3b8" font-family="sans-serif" font-size="12">• Pessimistic Account Locks</text>
    <text x="16" y="174" fill="#94a3b8" font-family="sans-serif" font-size="12">• Immutable Journal Postings</text>
    <text x="16" y="196" fill="#94a3b8" font-family="sans-serif" font-size="12">• Transactional Outbox Events</text>

    <rect x="16" y="210" width="198" height="18" rx="4" fill="#0369a1" opacity="0.3"/>
    <text x="24" y="223" fill="#7dd3fc" font-family="sans-serif" font-size="9.5" font-weight="700">200 REQ/S · P99 28.5MS · 0 FAIL</text>
  </g>

  <!-- Connection Line 2 -> 3 -->
  <path d="M520 270 L560 270" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4"/>
  <circle cx="560" cy="270" r="3" fill="#10b981"/>

  <!-- 3. Kafka & Observability Node -->
  <g transform="translate(565, 160)" filter="url(#shadow)">
    <rect width="195" height="220" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="16" y="16" width="36" height="36" rx="8" fill="#14532d"/>
    <circle cx="34" cy="34" r="7" stroke="#4ade80" stroke-width="2" fill="none"/>
    <text x="62" y="32" fill="#f1f5f9" font-family="sans-serif" font-size="15" font-weight="600">Event Stream</text>
    <text x="62" y="47" fill="#64748b" font-family="sans-serif" font-size="11">Kafka + Prometheus</text>

    <line x1="16" y1="68" x2="179" y2="68" stroke="#1e293b" stroke-width="1"/>

    <text x="16" y="95" fill="#94a3b8" font-family="monospace" font-size="11">• At-Least-Once Delivery</text>
    <text x="16" y="120" fill="#94a3b8" font-family="monospace" font-size="11">• 36,550 Events Transferred</text>
    <text x="16" y="145" fill="#94a3b8" font-family="monospace" font-size="11">• 0 Audit Discrepancies</text>
    <text x="16" y="170" fill="#94a3b8" font-family="monospace" font-size="11">• Prometheus / Actuator</text>

    <rect x="16" y="190" width="163" height="20" rx="4" fill="#1e293b"/>
    <text x="24" y="204" fill="#4ade80" font-family="sans-serif" font-size="10" font-weight="600">APACHE KAFKA RELAY</text>
  </g>
</svg>